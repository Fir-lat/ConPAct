[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conpact-agent"
version = "0.1.0"
requires-python = ">=3.10"
description = "ConPAct: Consistent Plan-Act coordination"
dependencies = []

[project.optional-dependencies]
sft = ["ms-swift>=4,<5", "deepspeed==0.18.6", "qwen-vl-utils"]

[project.scripts]
conpact-agent = "conpact_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"conpact_agent.envs.minigrid" = ["data/*.json"]
